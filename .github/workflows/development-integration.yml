name: Application development integration

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  framework-dev:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    defaults:
      run:
        working-directory: nour-api
    steps:
      - uses: actions/checkout@v6
        with:
          path: nour-api
      - uses: actions/checkout@v6
        with:
          repository: nour-api/framework
          ref: dev
          path: framework
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, xml, curl, fileinfo, pdo_sqlite
          coverage: none
      - name: Validate the release manifest
        run: composer validate --strict
      - name: Prepare the local framework dependency
        run: php .github/scripts/framework-checkout.php prepare ../framework
      - name: Install the CI dependency graph
        run: COMPOSER=composer.ci.json composer install --no-interaction --prefer-dist --no-plugins --no-scripts
      - name: Reject published framework fallback
        run: php .github/scripts/framework-checkout.php verify ../framework
      - name: Record the tested framework commit
        run: git -C ../framework rev-parse HEAD
      - name: Audit the resolved dependencies
        run: COMPOSER=composer.ci.json composer audit --locked
      - name: Check PHP syntax
        run: find app bootstrap database public routes tests .github/scripts -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run application HTTP tests
        run: COMPOSER=composer.ci.json composer --no-plugins test -- --fail-on-risky --fail-on-warning
      - name: Check Artisan startup
        run: php artisan list --raw
      - name: Preserve the release dependency files
        run: git diff --exit-code -- composer.json composer.lock
